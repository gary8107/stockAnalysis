<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="stock_analysis">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>stock_analysis</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    為什麼需要這段：
    Flutter Web 預設會註冊 Service Worker（flutter_service_worker.js），
    它會把 main.dart.js / assets/ 整包 cache 到瀏覽器，造成「deploy 完使用者重整還是看到舊版」的問題。
    SW 偵測到新版本後會進入 waiting 狀態，要等所有分頁都關掉才會 activate，
    對「每日更新分析師筆記」這種使用情境很不友善。

    這段監聽邏輯做的事：
    1. 等 SW ready（表示已有舊版在控制當前頁面）
    2. 監聽 updatefound：當瀏覽器偵測到 flutter_service_worker.js 有變更時觸發
    3. 等新 SW 安裝完成（state === 'installed'）且當前頁面是被舊 SW 控制（controller 存在）
    4. → 立即 window.location.reload()，使用者最多看到舊版「閃一下」就自動拿到新版

    注意：第一次訪問的新使用者（沒有舊 SW）→ controller 是 null → 不會觸發 reload（正確行為）
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(function (registration) {
        registration.addEventListener('updatefound', function () {
          var newWorker = registration.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', function () {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              window.location.reload();
            }
          });
        });
      });
    }
  </script>
</body>
</html>
